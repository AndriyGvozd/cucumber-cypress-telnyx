name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression, e.g. "@critical" (empty = all tests)'
        required: false
        default: ""

# Only one Pages deployment at a time; a newer run cancels an older one
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run Cypress tests
        id: tests
        # Let the job continue so the report is still built and published when tests fail
        continue-on-error: true
        uses: cypress-io/github-action@v6
        with:
          command: >-
            npx cypress run --config-file config/cypress.ci.config.ts
            ${{ inputs.tags && format('--expose tags="{0}"', inputs.tags) || '' }}

      - name: Generate HTML report
        if: always()
        run: npm run report

      - name: Upload screenshots and videos
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failures
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

      - name: Upload report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/html

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy-report:
    needs: test
    # Publish the report even when tests failed, but only from main
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
